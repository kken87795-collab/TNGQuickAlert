name: Build TNG Quick Alert

on:
  workflow_dispatch:
  push:
    paths:
      - 'TNGQuickAlert-project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q TNGQuickAlert-project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p TNGQuickAlert assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TNGQuickAlert-APK
          path: TNGQuickAlert/app/build/outputs/apk/debug/app-debug.apk
